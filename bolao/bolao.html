<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Bolão da Copa • Portal do Professor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 📊 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 🎨 CSS -->
  <link rel="stylesheet" href="bolao.css" />
</head>

<body>

  <div class="container">

    <!-- ================= HEADER ================= -->
    <header class="topo">

      <div class="efeito-copa"></div>

      <h1>🏆 Bolão da Copa</h1>

      <p class="sub">
        Aposte seus <strong>SP</strong> e concorra ao grande prêmio!
      </p>

    </header>

    <!-- ================= RESUMO ================= -->
    <section class="resumo" aria-label="Resumo do bolão">

      <div class="card destaque">
        <h3>💰 Prêmio acumulado</h3>
        <p id="premioTotal">0 SP</p>
      </div>

      <div class="card">
        <h3>👥 Total de apostas</h3>
        <p id="totalApostas">0</p>
      </div>

      <div class="card">
        <h3>🔥 Mais apostada</h3>
        <p id="topSelecao">--</p>
      </div>

    </section>

    <!-- ================= TABS ================= -->
    <nav class="tabs">

      <button class="tab active" data-aba="apostar">
        🎯 Apostar
      </button>

      <button class="tab" data-aba="estatisticas">
        📊 Estatísticas
      </button>

      <button class="tab" data-aba="ranking">
        🏆 Ranking
      </button>

    </nav>

    <!-- ================= APOSTAR ================= -->
    <section id="apostar" class="aba ativa">

      <!-- CARD APOSTA -->
      <div class="card">

        <h2>🎯 Fazer aposta</h2>

        <label for="selecao">Seleção</label>

        <select id="selecao">

  <!-- GRUPO A -->
  <optgroup label="Grupo A">
    <option value="México">🇲🇽 México</option>
    <option value="Suíça">🇨🇭 Suíça</option>
    <option value="Senegal">🇸🇳 Senegal</option>
    <option value="Nova Zelândia">🇳🇿 Nova Zelândia</option>
  </optgroup>

  <!-- GRUPO B -->
  <optgroup label="Grupo B">
    <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
    <option value="Croácia">🇭🇷 Croácia</option>
    <option value="Marrocos">🇲🇦 Marrocos</option>
    <option value="Panamá">🇵🇦 Panamá</option>
  </optgroup>

  <!-- GRUPO C -->
  <optgroup label="Grupo C">
    <option value="Argentina">🇦🇷 Argentina</option>
    <option value="Dinamarca">🇩🇰 Dinamarca</option>
    <option value="Japão">🇯🇵 Japão</option>
    <option value="Paraguai">🇵🇾 Paraguai</option>
  </optgroup>

  <!-- GRUPO D -->
  <optgroup label="Grupo D">
    <option value="Brasil">🇧🇷 Brasil</option>
    <option value="Holanda">🇳🇱 Holanda</option>
    <option value="Costa do Marfim">🇨🇮 Costa do Marfim</option>
    <option value="Iraque">🇮🇶 Iraque</option>
  </optgroup>

  <!-- GRUPO E -->
  <optgroup label="Grupo E">
    <option value="Espanha">🇪🇸 Espanha</option>
    <option value="Uruguai">🇺🇾 Uruguai</option>
    <option value="Tunísia">🇹🇳 Tunísia</option>
    <option value="Curaçao">🇨🇼 Curaçao</option>
  </optgroup>

  <!-- GRUPO F -->
  <optgroup label="Grupo F">
    <option value="França">🇫🇷 França</option>
    <option value="Colômbia">🇨🇴 Colômbia</option>
    <option value="Coreia do Sul">🇰🇷 Coreia do Sul</option>
    <option value="Áustria">🇦🇹 Áustria</option>
  </optgroup>

  <!-- GRUPO G -->
  <optgroup label="Grupo G">
    <option value="Inglaterra">🏴 Inglaterra</option>
    <option value="Equador">🇪🇨 Equador</option>
    <option value="Argélia">🇩🇿 Argélia</option>
    <option value="Canadá">🇨🇦 Canadá</option>
  </optgroup>

  <!-- GRUPO H -->
  <optgroup label="Grupo H">
    <option value="Portugal">🇵🇹 Portugal</option>
    <option value="Alemanha">🇩🇪 Alemanha</option>
    <option value="Egito">🇪🇬 Egito</option>
    <option value="Haiti">🇭🇹 Haiti</option>
  </optgroup>

  <!-- GRUPO I -->
  <optgroup label="Grupo I">
    <option value="Bélgica">🇧🇪 Bélgica</option>
    <option value="Suécia">🇸🇪 Suécia</option>
    <option value="Irã">🇮🇷 Irã</option>
    <option value="África do Sul">🇿🇦 África do Sul</option>
  </optgroup>

  <!-- GRUPO J -->
  <optgroup label="Grupo J">
    <option value="Itália">🇮🇹 Itália</option>
    <option value="Noruega">🇳🇴 Noruega</option>
    <option value="Catar">🇶🇦 Catar</option>
    <option value="Jordânia">🇯🇴 Jordânia</option>
  </optgroup>

  <!-- GRUPO K -->
  <optgroup label="Grupo K">
    <option value="Turquia">🇹🇷 Turquia</option>
    <option value="Tchéquia">🇨🇿 Tchéquia</option>
    <option value="Gana">🇬🇭 Gana</option>
    <option value="Austrália">🇦🇺 Austrália</option>
  </optgroup>

  <!-- GRUPO L -->
  <optgroup label="Grupo L">
    <option value="Bósnia e Herzegovina">🇧🇦 Bósnia e Herzegovina</option>
    <option value="RD do Congo">🇨🇩 RD do Congo</option>
    <option value="Uzbequistão">🇺🇿 Uzbequistão</option>
    <option value="Arábia Saudita">🇸🇦 Arábia Saudita</option>
  </optgroup>

</select>

        <label for="pontos">Quantidade de SP</label>

        <input
          type="number"
          id="pontos"
          min="1"
          max="100000"
          placeholder="Ex: 50"
        />

        <button class="btn" id="btnApostar">
          🚀 Confirmar palpite
        </button>

        <div class="info-aposta">

          <p id="simulacaoGanho"></p>

          <p id="statusAposta"></p>

        </div>

      </div>

      <!-- CARD MINHAS APOSTAS -->
      <div class="card">

        <h2>📌 Seus palpites</h2>

        <ul id="listaApostas"></ul>

      </div>

    </section>

    <!-- ================= ESTATÍSTICAS ================= -->
    <section id="estatisticas" class="aba">

      <div class="card">

        <h2>📊 Distribuição de palpites</h2>

        <div class="grafico-wrapper">
          <canvas id="graficoPizza"></canvas>
        </div>

      </div>

      <div class="card">

        <h2>📈 Evolução do prêmio</h2>

        <div class="grafico-wrapper">
          <canvas id="graficoLinha"></canvas>
        </div>

      </div>

    </section>

    <!-- ================= RANKING ================= -->
    <section id="ranking" class="aba">

      <div class="card">

        <h2>🏆 Ranking de palpiteiros</h2>

        <ol id="rankingLista"></ol>

      </div>

    </section>

  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal" id="modalAposta">

    <div class="modal-content">

      <h2>🎉 Palpite realizado!</h2>

      <p id="modalTexto"></p>

      <button id="fecharModal" class="btn">
        Fechar
      </button>

    </div>

  </div>

  <!-- ================= JS ================= -->
  <script type="module" src="bolao.js"></script>

</body>
</html>
